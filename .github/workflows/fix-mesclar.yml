name: One-time safe merge fix

on:
  push:
    paths:
      - '.github/workflows/fix-mesclar.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch null-safe deep merge
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app.html')
          s = p.read_text()
          old = '''function mesclar(base, novo) {
  if (novo === null || novo === undefined) return base;
  if (Array.isArray(base) || typeof base !== "object") return novo;
  if (typeof novo !== "object" || Array.isArray(novo)) return novo;
  const r = {};
  for (const k of new Set([...Object.keys(base), ...Object.keys(novo)])) {
    r[k] = k in base && k in novo ? mesclar(base[k], novo[k]) : (k in novo ? novo[k] : base[k]);
  }
  return r;
}'''
          new = '''function mesclar(base, novo) {
  if (novo === null || novo === undefined) return base;
  /* null também tem typeof "object" em JavaScript. Sem esta guarda,
     Object.keys(null) quebra a restauração de perfil e outros campos opcionais. */
  if (base === null || base === undefined) return novo;
  if (Array.isArray(base) || typeof base !== "object") return novo;
  if (typeof novo !== "object" || Array.isArray(novo)) return novo;
  const r = {};
  for (const k of new Set([...Object.keys(base), ...Object.keys(novo)])) {
    r[k] = k in base && k in novo ? mesclar(base[k], novo[k]) : (k in novo ? novo[k] : base[k]);
  }
  return r;
}'''
          if old not in s:
              raise SystemExit('Trecho esperado de mesclar() não encontrado; abortando sem alterar o app.')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Remove one-time workflow and commit
        run: |
          rm -f .github/workflows/fix-mesclar.yml
          git config user.name "muse-fix-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.html .github/workflows/fix-mesclar.yml
          git commit -m "fix: make saved-state merge null-safe"
          git push origin main
