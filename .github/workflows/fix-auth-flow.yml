name: Fix Muse auth flow

on:
  push:
    paths:
      - ".github/workflows/fix-auth-flow.yml"

permissions:
  contents: write

jobs:
  patch-auth-flow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch auth startup
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("nuvem.js")
          text = path.read_text(encoding="utf-8")
          marker = "  /* ---------------------------------------------------------\n     INÍCIO\n     --------------------------------------------------------- */\n  N.iniciar = async function () {"
          start = text.find(marker)
          if start < 0:
              raise SystemExit("Bloco INÍCIO não encontrado")

          end_marker = '  if (document.readyState !== "loading") N.iniciar(); else addEventListener("DOMContentLoaded", N.iniciar);\n})();'
          end = text.find(end_marker, start)
          if end < 0:
              raise SystemExit("Fim do bloco INÍCIO não encontrado")
          end += len(end_marker)

          replacement = r'''  /* ---------------------------------------------------------
     ENTRADA APÓS AUTENTICAÇÃO
     O app.html decide a tela antes de nuvem.js terminar de ler a sessão.
     Esta função reconcilia a interface assim que o Supabase confirma o login.
     --------------------------------------------------------- */
  let entradaAutenticadaResolvida = false;

  async function resolverEntradaAutenticada(c) {
    if (!sessao || entradaAutenticadaResolvida) return;

    let temPerfilRemoto = false;
    try {
      const { data, error } = await c.from("perfis")
        .select("user_id")
        .eq("user_id", sessao.user.id)
        .maybeSingle();
      if (error) throw error;
      temPerfilRemoto = !!data;
    } catch (e) {
      console.warn("perfil remoto:", e);
      return;
    }

    /* Em aparelho novo, baixe a conta antes de qualquer envio local. */
    if (!S.perfil && temPerfilRemoto) {
      await baixarTudo(c);
    }

    entradaAutenticadaResolvida = true;

    if (S.perfil) {
      const conta = document.getElementById("onbConta");
      const onb = document.getElementById("onb");
      const app = document.getElementById("app");
      const appJaVisivel = app && !app.classList.contains("hide");
      if (conta) conta.classList.add("hide");
      if (onb) onb.classList.add("hide");
      if (app) app.classList.remove("hide");
      if (!appJaVisivel && typeof iniciarApp === "function") iniciarApp();
    } else {
      /* Primeira conta, ainda sem perfil: segue para o onboarding. */
      const conta = document.getElementById("onbConta");
      if (conta) conta.classList.add("hide");
      if (typeof abrirOnb === "function") abrirOnb();
    }
  }

  /* ---------------------------------------------------------
     INÍCIO
     --------------------------------------------------------- */
  N.iniciar = async function () {
    pintarEstado();
    if (!LIGADO) return;
    try {
      const c = await cliente();
      const { data } = await c.auth.getSession();
      sessao = data.session || null;

      c.auth.onAuthStateChange(async (evt, s) => {
        const trocou = sessao && s && sessao.user.id !== s.user.id;
        sessao = s;
        N.usuario = s ? { id: s.user.id, email: s.user.email, nome: s.user.user_metadata?.full_name } : null;
        if (trocou) { location.reload(); return; }

        if (s) {
          N.estado = "ok";
          pintarEstado();
          await resolverEntradaAutenticada(c);
          await N.sincronizar(true);
        } else {
          entradaAutenticadaResolvida = false;
          N.estado = "local";
          pintarEstado();
        }
      });

      if (sessao) {
        N.usuario = { id: sessao.user.id, email: sessao.user.email, nome: sessao.user.user_metadata?.full_name };
        N.estado = "ok";
        pintarEstado();
        await resolverEntradaAutenticada(c);
        await N.sincronizar(true);
        setInterval(() => N.sincronizar(true), C.SYNC_INTERVALO || 60000);
      }
    } catch (e) {
      console.warn("nuvem:", e);
      N.estado = "erro";
      pintarEstado();
    }
  };
  if (document.readyState !== "loading") N.iniciar(); else addEventListener("DOMContentLoaded", N.iniciar);
})();'''

          path.write_text(text[:start] + replacement + text[end:], encoding="utf-8")
          PY

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nuvem.js
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "fix: continue app flow after Google login"
          git push
